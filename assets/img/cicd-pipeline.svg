<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">CI pipeline from GitHub to Amazon ECR</title>
  <desc id="d">A push to main triggers a GitHub Actions workflow that configures AWS credentials from repository secrets, logs in to Amazon ECR, builds and tags a Docker image of a Node.js app, and pushes it to ECR in ap-south-1. A Kubernetes Deployment with two replicas and a Helm chart in the repository describe how the image runs.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1d2226"/></marker></defs>
  <style>
    text{font-family:Archivo,Arial,Helvetica,sans-serif;fill:#1d2226}
    .h{font-size:14px;font-weight:700}
    .s{font-size:12px;fill:#50575e}
    .c{font-size:11.5px;fill:#2747a3}
    .box{fill:#fff;stroke:#1d2226;stroke-width:1.5}
    .grp{fill:none;stroke:#50575e;stroke-dasharray:5 4}
    .ln{stroke:#1d2226;stroke-width:1.4;fill:none}
  </style>
  <rect class="box" x="16" y="56" width="112" height="64" rx="3"/>
  <text class="h" x="30" y="84">git push</text>
  <text class="s" x="30" y="104">branch: main</text>

  <rect class="grp" x="160" y="20" width="392" height="140" rx="3"/>
  <text class="s" x="172" y="40">GitHub Actions · deploy.yml</text>
  <rect class="box" x="176" y="56" width="110" height="64" rx="3"/><text class="h" x="188" y="82">AWS creds</text><text class="s" x="188" y="102">from secrets</text>
  <rect class="box" x="300" y="56" width="110" height="64" rx="3"/><text class="h" x="312" y="82">ECR login</text><text class="s" x="312" y="102">aws-actions</text>
  <rect class="box" x="424" y="56" width="112" height="64" rx="3"/><text class="h" x="436" y="82">build · tag</text><text class="s" x="436" y="102">push :latest</text>
  <path class="ln" d="M128 88 H172" marker-end="url(#a)"/>
  <path class="ln" d="M286 88 H296" marker-end="url(#a)"/>
  <path class="ln" d="M410 88 H420" marker-end="url(#a)"/>

  <path class="box" d="M592 62 h112 v52 h-112z"/>
  <text class="h" x="604" y="86">Amazon ECR</text>
  <text class="s" x="604" y="104">ap-south-1</text>
  <path class="ln" d="M536 88 H588" marker-end="url(#a)"/>

  <rect class="box" x="16" y="210" width="210" height="96" rx="3"/>
  <text class="h" x="30" y="236">Dockerfile</text>
  <text class="s" x="30" y="256">node:18 base, npm install</text>
  <text class="s" x="30" y="274">Express app on :3000</text>

  <rect class="box" x="254" y="210" width="210" height="96" rx="3"/>
  <text class="h" x="268" y="236">deployment.yaml</text>
  <text class="s" x="268" y="256">Kubernetes Deployment</text>
  <text class="s" x="268" y="274">2 replicas, pulls from ECR</text>

  <rect class="box" x="492" y="210" width="212" height="96" rx="3"/>
  <text class="h" x="506" y="236">my-app-chart/</text>
  <text class="s" x="506" y="256">Helm chart packaging</text>
  <text class="s" x="506" y="274">the same deployment</text>

  <path class="ln" d="M121 210 V174 H480 V124" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text class="c" x="16" y="196">image definition</text>
  <path class="ln" d="M648 118 V206" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <path class="ln" d="M648 190 H359 V206" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text class="c" x="560" y="184">image pulled by</text>
  <text class="c" x="16" y="328">The workflow ends at the ECR push; applying the manifests to a cluster is a separate step.</text>
</svg>
